services:
  web:
    build:
      context: .
      args:
        BACKEND_URL: http://api:5000
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/zencode
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-change-me-refresh-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
