version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/zencode
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      - mongodb
      - redis
    networks:
      - zencode-network
    restart: unless-stopped

  mongodb:
    image: mongo:6
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: zencode
    volumes:
      - mongodb_data:/data/db
    networks:
      - zencode-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - zencode-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  zencode-network:
    driver: bridge
